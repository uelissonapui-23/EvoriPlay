name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testar e construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Executar testes
        run: pnpm test
      - name: Gerar versão de produção
        run: pnpm build
